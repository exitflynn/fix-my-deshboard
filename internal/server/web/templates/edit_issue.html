{{define "content"}}
<div class="page-narrow">
  <h1 class="page-title mb-2">Edit issue #{{.Issue.ID}}</h1>
  <p class="muted mb-3">You can change the title and details. The website or app, time seen, what the site said and screenshots are the record and can't be changed. Post a comment to correct them.</p>
  {{with .Errors}}<div class="flash flash-error" role="alert">{{range .}}<div>{{.}}</div>{{end}}</div>{{end}}
  <form method="post" action="/issues/{{.Issue.ID}}/edit">
    <div class="field">
      <label for="title">Title</label>
      <input class="input" id="title" name="title" value="{{.EditTitle}}" required maxlength="200">
    </div>
    <div class="field">
      <label for="body">Details</label>
      <textarea class="textarea" id="body" name="body" rows="10" maxlength="20000">{{.EditBody}}</textarea>
    </div>
    <div class="flex">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="/issues/{{.Issue.ID}}">Cancel</a>
    </div>
  </form>
</div>
{{end}}
