services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fixmydeshboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fixmydeshboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fixmydeshboard"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://fixmydeshboard:${POSTGRES_PASSWORD}@db:5432/fixmydeshboard?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      ADMIN_USERS: ${ADMIN_USERS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEV_LOGIN: ${DEV_LOGIN:-}
      BEHIND_PROXY: "1"
    ports:
      - "127.0.0.1:8080:8080" # for local dev; the public goes through caddy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
