{{define "content"}}
<div class="page-narrow">
  <h1 class="page-title mb-3">Edit comment</h1>
  {{with .Error}}<div class="flash flash-error">{{.}}</div>{{end}}
  <form method="post" action="/comments/{{.Comment.ID}}/edit">
    <textarea class="textarea" name="body" rows="8" maxlength="10000" required aria-label="Comment">{{.Comment.Body}}</textarea>
    <div class="flex mt-2">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="/issues/{{.Comment.IssueID}}#comment-{{.Comment.ID}}">Cancel</a>
    </div>
  </form>
  <hr class="rule mt-4">
  <h2 class="mt-3" style="font-size:22px">Delete this comment</h2>
  <p class="muted small mt-2">It will disappear from the issue. You can't undo this yourself.</p>
  <form method="post" action="/comments/{{.Comment.ID}}/delete">
    <button class="btn btn-danger btn-sm" type="submit">Delete comment</button>
  </form>
</div>
{{end}}
