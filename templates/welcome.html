{{define "content"}}
<div class="narrow">
  <h1 class="h2 mb-1">Choose a username</h1>
  <p class="color-fg-muted mb-4">This is how your issues and comments will be signed. It can't be changed later, so don't use your real name unless you want to.</p>
  {{with .Error}}<div class="flash flash-error mb-3">{{.}}</div>{{end}}
  <form method="post" action="/welcome">
    <div class="form-group mt-0">
      <div class="form-group-header"><label for="username">Username</label></div>
      <div class="form-group-body">
        <input class="form-control" id="username" name="username" value="{{with .Username}}{{.}}{{end}}" required
               minlength="3" maxlength="30" pattern="[a-z0-9_-]+" autocapitalize="off" autocomplete="off" placeholder="rail_watcher">
        <p class="note">3–30 lowercase letters, numbers, - or _.</p>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">Continue</button>
  </form>
  <form method="post" action="/logout" class="mt-3"><button class="btn-link f6" type="submit">Cancel and log out</button></form>
</div>
{{end}}
