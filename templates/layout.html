{{define "layout"}}<!doctype html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{with .Title}}{{.}} · {{end}}babu-log</title>
  <meta property="og:site_name" content="babu-log">
  <meta property="og:title" content="{{with .Title}}{{.}}{{else}}babu-log{{end}}">
  {{with .Description}}<meta name="description" content="{{.}}"><meta property="og:description" content="{{.}}">{{end}}
  {{with .Image}}<meta property="og:image" content="{{.}}"><meta name="twitter:card" content="summary_large_image">{{end}}
  <link rel="stylesheet" href="/static/primer.css">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
{{if not .Home}}
<header class="Header px-3 px-md-5">
  <div class="Header-item"><a href="/" class="Header-link wordmark">babu-log</a></div>
  <div class="Header-item Header-item--full"><a href="/issues" class="Header-link">Issues</a></div>
  <div class="Header-item mr-0"><a href="/issues/new" class="btn btn-sm btn-primary">File an Issue</a></div>
</header>
<main class="container-lg px-3 py-4">{{template "content" .}}</main>
{{else}}
<main>{{template "content" .}}</main>
{{end}}
</body>
</html>{{end}}
