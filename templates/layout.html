{{define "layout"}}<!doctype html>
<html lang="en"{{with .Theme}} data-theme="{{.}}"{{end}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{with .Title}}{{.}} · {{end}}babu-log</title>
  <meta property="og:site_name" content="babu-log">
  <meta property="og:title" content="{{with .OGTitle}}{{.}}{{else}}{{with .Title}}{{.}}{{else}}babu-log{{end}}{{end}}">
  {{with .Description}}<meta name="description" content="{{.}}"><meta property="og:description" content="{{.}}">{{end}}
  {{with .Image}}<meta property="og:image" content="{{.}}"><meta name="twitter:card" content="summary_large_image">{{end}}
  <link rel="preload" href="/static/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
{{if not .Home}}
<header class="site-header">
  <a href="/" class="wordmark">babu-log</a>
  <nav class="site-nav" aria-label="Main">
    <a href="/issues"{{if and .Path (hasPrefix .Path "/issues") (not (hasPrefix .Path "/issues/new"))}} class="active"{{end}}>Issues</a>
    {{if and .User .User.IsAdmin}}<a href="/admin"{{if hasPrefix .Path "/admin"}} class="active"{{end}}>Admin</a>{{end}}
  </nav>
  <div class="header-end">{{template "account" .}}</div>
</header>
<hr class="rule">
<main class="page">{{template "content" .}}</main>
{{else}}
<main>{{template "content" .}}</main>
{{end}}
</body>
</html>{{end}}
